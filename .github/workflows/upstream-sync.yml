name: Sync upstream

# 每天把上游 basketikun/infinite-canvas 的 main 合进来：合并成功跑一次构建并开 PR，冲突则建 issue。
# 细节与冲突处理手册见 FORK.md。
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/basketikun/infinite-canvas.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: chore/sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.up-to-date == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
            git merge --abort || true
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.conflict == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.merge.outputs.conflict == 'false'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Push branch and open pull request
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          if [ -z "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream" \
              --body "自动合并上游 \`$UPSTREAM_BRANCH\`，并通过 \`npm run build\`。

合并前请按 \`FORK.md\` 复核补丁点是否仍然完整。"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(printf '自动同步上游时出现冲突，未自动合并。请在本地按 `FORK.md` 的冲突处理手册解决：\n\n```\n%s\n```' "$(cat "$RUNNER_TEMP/conflicts.txt")")"
          existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "上游同步出现冲突" --label upstream-sync --body "$body"
          fi
